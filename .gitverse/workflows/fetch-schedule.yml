name: Fetch SPbGASU schedule and hand off to GitHub

on:
  workflow_dispatch:
    inputs:
      force_digest:
        description: Send a schedule preview even outside the evening window
        required: false
        default: false
        type: boolean
      probe_schema:
        description: Print a redacted SPbGASU response shape and do not dispatch or send
        required: false
        default: false
        type: boolean
  schedule:
    # Moscow time: 06:50, 12:20, 17:20 and 20:30.
    - cron: "50 3 * * *"
    - cron: "20 9 * * *"
    - cron: "20 14 * * *"
    - cron: "30 17 * * *"

jobs:
  fetch:
    runs-on: ubuntu-cloud-runner
    timeout-minutes: 5
    env:
      SPBGASU_GROUP_ID: 3-СУЗСс-3
      SPBGASU_BASE_URL: https://rasp.spbgasu.ru
      TIMEZONE: Europe/Moscow
      BRIDGE_GH_REPOSITORY: volobanov545/gasu-schedule-bot
      BRIDGE_GH_TOKEN: ${{ secrets.BRIDGE_GH_TOKEN }}
      FEATURE_PROFILE: schedule_only
      TELEGRAM_MODE: outbound_only
      AI_KILL_SWITCH: "true"
      SCHEDULE_FORCE_DIGEST: ${{ inputs.force_digest }}
      SPBGASU_PROBE_SCHEMA: ${{ inputs.probe_schema }}

    steps:
      - name: Check out the current GitHub source
        uses: actions/checkout@v5
        with:
          repository: volobanov545/gasu-schedule-bot
          ref: main
          token: ${{ secrets.BRIDGE_GH_TOKEN }}
          github-server-url: https://github.com
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install schedule bridge
        run: python -m pip install .

      - name: Fetch and hand off the two-week schedule
        run: |
          if [ "$SPBGASU_PROBE_SCHEMA" = "true" ]; then
            szs-hub probe-spbgasu
          elif [ "$SCHEDULE_FORCE_DIGEST" = "true" ]; then
            szs-hub dispatch-tomorrow --force-digest
          else
            szs-hub dispatch-tomorrow
          fi
