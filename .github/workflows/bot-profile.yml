name: Update bot subject glossary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/szs_hub/schedule/subjects.py
      - src/szs_hub/schedule/bot_profile.py
      - .github/workflows/bot-profile.yml

permissions:
  contents: read

concurrency:
  group: bot-profile-glossary
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bot profile updater
        run: python -m pip install .
      - name: Update and verify bot descriptions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m szs_hub.schedule.bot_profile
