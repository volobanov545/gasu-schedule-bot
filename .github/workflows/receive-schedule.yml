name: Send schedule received from GitVerse

on:
  workflow_dispatch:
    inputs:
      text_b64:
        description: Prepared schedule card encoded as Base64
        required: true
        type: string
      group:
        description: SPbGASU group identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: szs-schedule-state
  queue: max
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
      SCHEDULE_TOPIC_ID: ${{ secrets.SCHEDULE_TOPIC_ID }}
      SPBGASU_GROUP_ID: ${{ secrets.SPBGASU_GROUP_ID }}
      SCHEDULE_TEXT_B64: ${{ inputs.text_b64 }}
      SCHEDULE_GROUP: ${{ inputs.group }}
      SCHEDULE_STATE_PATH: .schedule-state/state.json
      SCHEDULE_CALENDAR_PATH: .calendar-output/calendar.ics
      FEATURE_PROFILE: schedule_only
      TELEGRAM_MODE: outbound_only
      AI_KILL_SWITCH: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install schedule receiver
        run: python -m pip install .

      - name: Restore the latest comparison state
        uses: actions/cache/restore@v6
        with:
          path: .schedule-state
          key: schedule-state-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            schedule-state-v3-

      - name: Compare and update Telegram when useful
        run: szs-hub publish-dispatched

      - name: Preserve the generated phone calendar
        uses: actions/upload-artifact@v4
        with:
          name: phone-calendar
          path: .calendar-output/calendar.ics
          retention-days: 7

      - name: Save comparison state
        uses: actions/cache/save@v6
        with:
          path: .schedule-state
          key: schedule-state-v3-${{ github.run_id }}-${{ github.run_attempt }}
