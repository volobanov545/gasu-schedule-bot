name: Remind about today's classes

on:
  workflow_dispatch:
  schedule:
    # UTC moments for every first-class-minus-2h and every useful transition.
    - cron: "0 4 * * *"
    - cron: "45 5 * * *"
    - cron: "30 7 * * *"
    - cron: "15 7 * * *"
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
    - cron: "45 10 * * *"
    - cron: "45 11 * * *"
    - cron: "15 13 * * *"
    - cron: "30 13 * * *"
    - cron: "0 15 * * *"
    - cron: "15 15 * * *"
    - cron: "45 16 * * *"

permissions:
  contents: read

concurrency:
  group: szs-schedule-state
  queue: max
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
      SCHEDULE_TOPIC_ID: ${{ secrets.SCHEDULE_TOPIC_ID }}
      SPBGASU_GROUP_ID: ${{ secrets.SPBGASU_GROUP_ID }}
      SCHEDULE_STATE_PATH: .schedule-state/state.json
      FEATURE_PROFILE: schedule_only
      TELEGRAM_MODE: outbound_only
      AI_KILL_SWITCH: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install schedule reminder
        run: python -m pip install .

      - name: Restore the latest schedule state
        uses: actions/cache/restore@v6
        with:
          path: .schedule-state
          key: schedule-state-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            schedule-state-v3-

      - name: Send a reminder only when it is due
        run: szs-hub publish-reminder

      - name: Save reminder state
        uses: actions/cache/save@v6
        with:
          path: .schedule-state
          key: schedule-state-v3-${{ github.run_id }}-${{ github.run_attempt }}
