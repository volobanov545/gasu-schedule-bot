name: Remind about today's classes

on:
  workflow_dispatch:
  schedule:
    # Backup reminder sweep every 15 minutes, 07:08-22:53 Moscow time,
    # Monday-Saturday. Offset minutes avoid GitHub's busiest :00 boundary.
    - cron: "8,23,38,53 4-19 * * 1-6"

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: szs-schedule-state
      queue: single
      cancel-in-progress: false
    env:
      SCHEDULE_SENDER: ${{ vars.SCHEDULE_SENDER || 'bot' }}
      TELEGRAM_USER_CREDENTIALS: ${{ secrets.TELEGRAM_USER_CREDENTIALS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
      SCHEDULE_TOPIC_ID: ${{ secrets.SCHEDULE_TOPIC_ID }}
      SPBGASU_GROUP_ID: ${{ secrets.SPBGASU_GROUP_ID }}
      SCHEDULE_STATE_PATH: .schedule-state/state.json
      SCHEDULE_CALENDAR_URL: https://volobanov545.github.io/gasu-schedule-bot/calendar.ics
      FEATURE_PROFILE: schedule_only
      TELEGRAM_MODE: outbound_only
      AI_KILL_SWITCH: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install schedule reminder
        run: python -m pip install .

      - name: Set up personal sender runtime
        if: env.SCHEDULE_SENDER == 'user'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install personal sender
        if: env.SCHEDULE_SENDER == 'user'
        run: npm ci --prefix tools/telegram-personal --no-audit --no-fund

      - name: Restore the latest schedule state
        uses: actions/cache/restore@v6
        with:
          path: .schedule-state
          key: schedule-state-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            schedule-state-v3-

      - name: Refresh live card and send only due reminders
        run: szs-hub publish-reminder

      - name: Save reminder state
        uses: actions/cache/save@v6
        with:
          path: .schedule-state
          key: schedule-state-v3-${{ github.run_id }}-${{ github.run_attempt }}
