name: Test schedule publisher

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test tools
        run: python -m pip install ".[dev]"

      - name: Set up personal sender test runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install and test the optional personal sender
        run: |
          npm ci --prefix tools/telegram-personal --no-audit --no-fund
          npm test --prefix tools/telegram-personal

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy src

      - name: Test
        run: pytest -q
