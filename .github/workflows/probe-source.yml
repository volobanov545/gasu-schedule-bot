name: Check direct public schedule access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SPBGASU_GROUP_ID: 3-СУЗСс-3
      FEATURE_PROFILE: schedule_only
      TELEGRAM_MODE: outbound_only
      AI_KILL_SWITCH: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install schedule diagnostics
        run: python -m pip install .

      - name: Check the public source without publishing
        run: szs-hub probe-spbgasu
